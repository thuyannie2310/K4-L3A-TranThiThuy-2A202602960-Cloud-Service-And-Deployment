# Requires Docker Compose 2.24.4+ for !override.
# docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale agent=3
services:
  agent:
    ports: !override []
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
